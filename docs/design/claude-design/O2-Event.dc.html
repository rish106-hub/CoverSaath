<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Onboarding step 2: what is coming up</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&amp;family=Source+Sans+3:wght@400;600;700&amp;display=swap">
<style>
body{margin:0}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none !important;animation:none !important}}
a{color:#176F69}a:hover{color:#125A55}
:focus-visible{outline:2px solid #163F42;outline-offset:2px;box-shadow:0 0 0 5px #E0A02B !important}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#F3F7F6;font-family:'Source Sans 3',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;color:#1A3034;display:flex;flex-direction:column">
<div style="height:64px;padding:0 12px;display:flex;align-items:center;justify-content:space-between">
<a href="O1-Start.dc.html" aria-label="Back" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#163F42"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"></path><path d="M11 6l-6 6 6 6"></path></svg></a>
<span style="font-size:15px;font-weight:600;letter-spacing:0.01em;color:#55696D;padding-right:8px">Step 2 of 5</span>
</div>
<div style="flex:1 1 auto;padding:24px 20px 0;display:flex;flex-direction:column;gap:16px">
<h1 style="margin:0;font-family:Newsreader,'Iowan Old Style',Georgia,serif;font-weight:400;font-size:32px;line-height:1.15;letter-spacing:-0.01em;color:#163F42">What is coming up?</h1>
<p style="margin:0;font-size:17px;line-height:1.6">This tells us what to read first.</p>
<fieldset style="margin:8px 0 0;padding:0;border:0;display:flex;flex-direction:column;gap:10px">
<legend style="position:absolute;left:-9999px">What is coming up</legend>
<sc-for list="{{ options }}" as="o" hint-placeholder-count="5">
<button type="button" onClick="{{ o.pick }}" aria-pressed="{{ o.on }}" style="{{ o.style }}"><span>{{ o.label }}</span><sc-if value="{{ o.selected }}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="5 12.5 10 17 19 7"></polyline></svg></sc-if></button>
</sc-for>
</fieldset>
</div>
<div style="padding:20px">
<a href="O3-People.dc.html" style="display:flex;align-items:center;justify-content:center;height:56px;border-radius:999px;background:#176F69;color:#FFFFFF;font-size:17px;font-weight:600;text-decoration:none">Continue</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { picked: 0 }; }
  renderVals() {
    var self = this;
    var labels = ['A renewal', 'Planned treatment', 'A job change', 'Parents’ cover', 'Nothing yet, just getting organised'];
    var base = 'width:100%;min-height:56px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-radius:10px;font:inherit;font-size:17px;text-align:left;cursor:pointer;';
    return {
      options: labels.map(function (label, i) {
        var sel = self.state.picked === i;
        return {
          label: label, selected: sel, on: sel ? 'true' : 'false',
          style: base + (sel ? 'background:#E3F0EE;border:2px solid #176F69;color:#163F42;font-weight:600;' : 'background:#FFFFFF;border:1px solid #7B918E;color:#1A3034;'),
          pick: function () { self.setState({ picked: i }); }
        };
      })
    };
  }
}
</script>
</body>
</html>
