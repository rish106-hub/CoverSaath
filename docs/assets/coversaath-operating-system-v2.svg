<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1500" viewBox="0 0 2400 1500">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0D2D3C" flood-opacity="0.10"/></filter>
    <style>
      .title{font-family:Arial,sans-serif;font-size:50px;font-weight:700;fill:#123847;letter-spacing:-1px}.sub{font-family:Arial,sans-serif;font-size:21px;fill:#5B6D73}.eyebrow{font-family:Arial,sans-serif;font-size:17px;font-weight:700;fill:#0E7567;letter-spacing:2px}.head{font-family:Arial,sans-serif;font-size:25px;font-weight:700;fill:#123847}.card{font-family:Arial,sans-serif;font-size:21px;font-weight:700;fill:#123847}.body{font-family:Arial,sans-serif;font-size:16px;fill:#40535A}.small{font-family:Arial,sans-serif;font-size:14px;fill:#60747B}.mono{font-family:Arial,sans-serif;font-size:15px;font-weight:700;fill:#123847}.white{font-family:Arial,sans-serif;font-size:17px;fill:#FFF}.whitehead{font-family:Arial,sans-serif;font-size:21px;font-weight:700;fill:#FFF}.teal{font-family:Arial,sans-serif;font-size:15px;font-weight:700;fill:#0E7567}.orange{font-family:Arial,sans-serif;font-size:15px;font-weight:700;fill:#B75D32}
    </style>
    <marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12z" fill="#0E7567"/></marker>
    <marker id="g" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12z" fill="#83989D"/></marker>
  </defs>
  <rect width="2400" height="1500" fill="#F7F3EB"/><rect x="60" y="48" width="2280" height="1402" rx="28" fill="#FFFDF8" stroke="#D8E2DD" stroke-width="2"/>
  <text x="130" y="118" class="eyebrow">COVERSAATH  |  HOUSEHOLD HEALTH-COVER OPERATING SYSTEM</text>
  <text x="130" y="182" class="title">Know what the family has. Decide what it needs. Act without starting from zero.</text>
  <text x="130" y="222" class="sub">The moat is not another comparison screen. It is a permissioned, source-linked record that gets more useful across buying, care and emergencies.</text>
  <line x1="130" y1="260" x2="2270" y2="260" stroke="#D8E2DD" stroke-width="2"/>

  <!-- three product lanes -->
  <text x="130" y="315" class="eyebrow">01  THE PRODUCT LOOP</text><text x="130" y="352" class="head">One household record, three high-value moments</text>
  <g filter="url(#shadow)"><rect x="130" y="385" width="650" height="350" rx="20" fill="#E9F5F0" stroke="#B7D9CE" stroke-width="2"/></g>
  <circle cx="175" cy="432" r="23" fill="#0E7567"/><text x="168" y="439" style="font-family:Arial;font-size:19px;font-weight:700;fill:#fff">1</text><text x="215" y="439" class="card">BUILD THE FAMILY MAP</text>
  <path d="M170 485 L365 485 L345 530 L150 530 Z" fill="#FFF" stroke="#B7D9CE" stroke-width="2"/><text x="177" y="514" class="mono">POLICY + BENEFIT INPUTS</text>
  <text x="170" y="568" class="body">Retail/family policies  •  employer group cover</text><text x="170" y="594" class="body">Top-ups  •  relevant card benefits  •  other mediclaim</text>
  <text x="170" y="634" class="body">AI extracts members, limits, exclusions, dates and</text><text x="170" y="660" class="body">terms. Every fact is tagged: confirmed / uncertain / missing.</text>
  <rect x="170" y="683" width="557" height="32" rx="10" fill="#D1E9DF"/><text x="187" y="705" class="teal">MOAT LAYER: normalised multi-policy, per-person evidence graph</text>

  <line x1="792" y1="558" x2="860" y2="558" stroke="#0E7567" stroke-width="5" marker-end="url(#a)"/>
  <g filter="url(#shadow)"><rect x="875" y="385" width="650" height="350" rx="20" fill="#FFF7EB" stroke="#ECD5AD" stroke-width="2"/></g>
  <circle cx="920" cy="432" r="23" fill="#C96A3D"/><text x="913" y="439" style="font-family:Arial;font-size:19px;font-weight:700;fill:#fff">2</text><text x="960" y="439" class="card">MAKE IT OPERABLE</text>
  <rect x="915" y="485" width="268" height="78" rx="12" fill="#FFF"/><text x="937" y="516" class="mono">Permission layer</text><text x="937" y="540" class="small">adult chooses viewers and actions</text>
  <rect x="1200" y="485" width="268" height="78" rx="12" fill="#FFF"/><text x="1222" y="516" class="mono">Operator graph</text><text x="1222" y="540" class="small">who knows, decides and helps</text>
  <text x="915" y="603" class="body">Run a five-minute drill with a backup person.</text><text x="915" y="629" class="body">If it fails, guide the family through recovery, then re-test.</text>
  <text x="915" y="660" class="body">Generate a printable/shareable emergency handover:</text><text x="915" y="686" class="body">policy route, helpline, insured members, operator and unknowns.</text>
  <rect x="915" y="700" width="557" height="32" rx="10" fill="#F6DFC4"/><text x="932" y="722" class="orange">MOAT LAYER: consent, handover and learning loop inside real families</text>

  <line x1="1537" y1="558" x2="1605" y2="558" stroke="#0E7567" stroke-width="5" marker-end="url(#a)"/>
  <g filter="url(#shadow)"><rect x="1620" y="385" width="650" height="350" rx="20" fill="#123847"/></g>
  <circle cx="1665" cy="432" r="23" fill="#9DE0CD"/><text x="1658" y="439" style="font-family:Arial;font-size:19px;font-weight:700;fill:#123847">3</text><text x="1705" y="439" class="whitehead">ACT AT THE RIGHT MOMENT</text>
  <text x="1660" y="493" style="font-family:Arial;font-size:17px;font-weight:700;fill:#9DE0CD">BUY OR RENEW</text><text x="1815" y="493" class="white">Gap + sources → human review → partner</text>
  <line x1="1660" y1="516" x2="2225" y2="516" stroke="#3B6570" stroke-width="2"/>
  <text x="1660" y="556" style="font-family:Arial;font-size:17px;font-weight:700;fill:#9DE0CD">PLANNED CARE</text><text x="1815" y="556" class="white">Hospital + estimate → routes, cash and checklist</text>
  <line x1="1660" y1="579" x2="2225" y2="579" stroke="#3B6570" stroke-width="2"/>
  <text x="1660" y="619" style="font-family:Arial;font-size:17px;font-weight:700;fill:#9DE0CD">EMERGENCY</text><text x="1815" y="619" class="white">One button → a human sees the permitted record</text>
  <text x="1660" y="678" style="font-family:Arial;font-size:16px;fill:#F9D6B4">The tool prepares and explains. Insurer/TPA confirms eligibility,</text><text x="1660" y="702" style="font-family:Arial;font-size:16px;fill:#F9D6B4">pre-authorisation and settlement.</text>

  <!-- decision tree -->
  <line x1="130" y1="782" x2="2270" y2="782" stroke="#D8E2DD" stroke-width="2"/>
  <text x="130" y="835" class="eyebrow">02  DECISION LOGIC</text><text x="130" y="872" class="head">The system does not sell first. It proves the situation first.</text>
  <path d="M325 920 L450 985 L325 1050 L200 985 Z" fill="#E9F5F0" stroke="#0E7567" stroke-width="2"/><text x="260" y="979" class="mono">Is cover known</text><text x="274" y="1002" class="mono">per person?</text>
  <line x1="455" y1="985" x2="555" y2="985" stroke="#0E7567" stroke-width="4" marker-end="url(#a)"/><text x="482" y="966" class="teal">YES</text>
  <path d="M695 920 L820 985 L695 1050 L570 985 Z" fill="#FFF7EB" stroke="#C96A3D" stroke-width="2"/><text x="641" y="979" class="mono">Is there a</text><text x="626" y="1002" class="mono">meaningful gap?</text>
  <line x1="825" y1="985" x2="925" y2="985" stroke="#0E7567" stroke-width="4" marker-end="url(#a)"/><text x="852" y="966" class="teal">YES</text>
  <rect x="945" y="932" width="305" height="106" rx="14" fill="#123847"/><text x="975" y="969" class="whitehead">Recommend a route</text><text x="975" y="997" class="white">Source-linked rationale +</text><text x="975" y="1021" class="white">commission disclosure + human gate</text>
  <line x1="1258" y1="985" x2="1368" y2="985" stroke="#0E7567" stroke-width="4" marker-end="url(#a)"/>
  <rect x="1385" y="932" width="275" height="106" rx="14" fill="#E9F5F0" stroke="#B7D9CE" stroke-width="2"/><text x="1412" y="969" class="card">Customer approves</text><text x="1412" y="997" class="body">Licensed partner transacts.</text><text x="1412" y="1021" class="body">Issued policy is checked.</text>
  <path d="M325 1056 C325 1104 1090 1104 1090 1060" fill="none" stroke="#83989D" stroke-width="3" marker-end="url(#g)"/><text x="468" y="1093" class="small">NO → request one specific missing document or permission. Never guess.</text>
  <path d="M695 1056 C695 1150 1770 1150 1770 1050" fill="none" stroke="#83989D" stroke-width="3" marker-end="url(#g)"/><text x="1125" y="1140" class="small">NO → retain existing cover. Give card, handover and the next relevant event.</text>
  <g filter="url(#shadow)"><rect x="1775" y="900" width="465" height="168" rx="18" fill="#FFF" stroke="#C8D7D9" stroke-width="2"/></g>
  <!-- support human illustration -->
  <circle cx="1842" cy="955" r="30" fill="#B8D9CD"/><circle cx="1842" cy="947" r="12" fill="#123847"/><path d="M1819 984 Q1842 960 1865 984 L1865 1008 L1819 1008Z" fill="#123847"/>
  <text x="1890" y="942" class="card">Human support is contextual</text><text x="1890" y="972" class="body">Not a person reading an AI answer aloud.</text><text x="1890" y="997" class="body">They see permitted facts, interpret them,</text><text x="1890" y="1022" class="body">and help the household take its next action.</text>

  <!-- build stack -->
  <line x1="130" y1="1188" x2="2270" y2="1188" stroke="#D8E2DD" stroke-width="2"/>
  <text x="130" y="1236" class="eyebrow">03  BUILDABLE TECH STACK</text><text x="130" y="1272" class="head">Hackathon: prove the workflow with uploads and mock data. Production: earn integrations gradually.</text>
  <g filter="url(#shadow)"><rect x="130" y="1300" width="390" height="100" rx="14" fill="#FFFFFF" stroke="#C8D7D9" stroke-width="2"/></g><text x="157" y="1334" class="mono">Front end</text><text x="157" y="1362" class="body">Next.js / React PWA • secure login • shareable card</text><text x="157" y="1386" class="small">Prototype: web app, PDF upload, guided intake</text>
  <g filter="url(#shadow)"><rect x="545" y="1300" width="390" height="100" rx="14" fill="#E9F5F0" stroke="#B7D9CE" stroke-width="2"/></g><text x="572" y="1334" class="mono">Evidence + data</text><text x="572" y="1362" class="body">Postgres • encrypted object store • audit log</text><text x="572" y="1386" class="small">Member, policy, source page, consent and case state</text>
  <g filter="url(#shadow)"><rect x="960" y="1300" width="390" height="100" rx="14" fill="#FFF7EB" stroke="#ECD5AD" stroke-width="2"/></g><text x="987" y="1334" class="mono">Intelligence + rules</text><text x="987" y="1362" class="body">OCR + structured extraction • LLM task agents</text><text x="987" y="1386" class="small">Versioned policy rules and permission checks in code</text>
  <g filter="url(#shadow)"><rect x="1375" y="1300" width="390" height="100" rx="14" fill="#FFFFFF" stroke="#C8D7D9" stroke-width="2"/></g><text x="1402" y="1334" class="mono">Workflow + human desk</text><text x="1402" y="1362" class="body">TypeScript API • job queue • reviewer console</text><text x="1402" y="1386" class="small">Escalate purchase, ambiguity and requested help</text>
  <g filter="url(#shadow)"><rect x="1790" y="1300" width="450" height="100" rx="14" fill="#123847"/></g><text x="1817" y="1334" style="font-family:Arial;font-size:15px;font-weight:700;fill:#9DE0CD">DO NOT PUT IN THE FIRST BUILD</text><text x="1817" y="1362" class="white">No full investment, tax or credit aggregation.</text><text x="1817" y="1386" style="font-family:Arial;font-size:14px;fill:#D9E9E7">Use voluntary income, EMI and savings after a gap is known.</text>
</svg>
