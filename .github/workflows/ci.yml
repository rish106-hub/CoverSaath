# Required status check: "CI / verify"  (workflow name "CI", job name "verify").
# Do not rename the workflow or the job without updating the repository ruleset.
# No path filters: this workflow must run on every pull request so the required
# check can never be skipped. No secrets, no cloud credentials, read-only token.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    # Throwaway PostgreSQL for tests only (ADR 0004 D1, D9). Trust auth is
    # reachable only from this job's runner; it holds synthetic data only.
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
        env:
          POSTGRES_USER: coversaath
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coversaath"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://coversaath@localhost:5432/postgres
      REQUIRE_POSTGRES: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 26
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Run project checks (architecture, tests, entry point)
        run: npm run check

      - name: Run safety evaluations
        run: npm run eval:safety

  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # PR: base branch tip. Push: previous tip (all zeros on a first push, which the step skips).
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - name: Check out repository with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 26
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Check for whitespace errors in the change
        run: |
          set -euo pipefail
          if [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "No previous commit; skipping diff check."
            exit 0
          fi
          # Endpoints, not merge-base: after a force-push the old tip may not be an ancestor of HEAD.
          git diff --check "$BASE_SHA" HEAD

      - name: Require migrations to be appended, never edited
        run: |
          set -euo pipefail
          if [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "No previous commit; skipping migration check."
            exit 0
          fi
          node scripts/check-migrations-append-only.mjs --base "$BASE_SHA"

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # gitleaks 8.30.1, checksum-pinned. Bump version and sha256 together.
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - name: Check out repository with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (checksum verified)
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --proto '=https' --tlsv1.2 -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan full git history for secrets
        run: |
          set -euo pipefail
          # Use the allowlist from the base revision, so a change cannot allowlist its own secret. A change to
          # .gitleaks.toml takes effect after it merges. Falls back to the checked-out file when there is no base
          # (first push, force-push to an unknown tip) or the base has no config yet.
          config="$RUNNER_TEMP/gitleaks.toml"
          if [ -n "${BASE_SHA:-}" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ] \
            && git show "$BASE_SHA:.gitleaks.toml" > "$config" 2>/dev/null; then
            echo "Using .gitleaks.toml from base $BASE_SHA."
          else
            cp .gitleaks.toml "$config"
            echo "No base config; using the checked-out .gitleaks.toml."
          fi
          # Scan the history reachable from this checkout. Without --log-opts gitleaks walks every ref, so an unrelated
          # branch fetched by fetch-depth 0 could fail this job.
          gitleaks git --config "$config" --redact --no-banner --exit-code 1 --log-opts="HEAD" .

  node25-permissions:
    name: node25-permissions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up minimum supported Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 25
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Prove PDF child permission denial
        run: node --test tests/pdf-inspection-sandbox.test.mjs
