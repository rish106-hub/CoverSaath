# Required status check: "CI / verify"  (workflow name "CI", job name "verify").
# Do not rename the workflow or the job without updating the repository ruleset.
# No path filters: this workflow must run on every pull request so the required
# check can never be skipped. No secrets, no cloud credentials, read-only token.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    # Throwaway PostgreSQL for tests only (ADR 0004 D1, D9). Trust auth is
    # reachable only from this job's runner; it holds synthetic data only.
    services:
      postgres:
        image: postgres:17.11@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_USER: coversaath
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coversaath"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://coversaath@localhost:5432/postgres
      REQUIRE_POSTGRES: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 26
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Check architecture boundaries
        run: npm run check:architecture

      - name: Run tests
        run: npm test

      - name: Validate backend entry point
        run: npm run build

      - name: Run safety evaluations
        run: npm run eval:safety

  node25-permissions:
    name: node25-permissions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up minimum supported Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 25
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Prove PDF child permission denial
        run: node --test tests/pdf-inspection-sandbox.test.mjs
