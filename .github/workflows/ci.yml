# Required status check: "CI / verify"  (workflow name "CI", job name "verify").
# Do not rename the workflow or the job without updating the repository ruleset.
# No path filters: this workflow must run on every pull request so the required
# check can never be skipped. No secrets, no cloud credentials, read-only token.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Check architecture boundaries
        run: npm run check:architecture

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Run safety evaluations
        run: npm run eval:safety
