# CoverSaath API (Fly app knowvia-api). Nothing is deployed until `fly deploy` is run (owner approval required).
app = "knowvia-api"
# Owner decision (P1): Singapore. Fly has no Mumbai region, and Singapore is the nearest to India. The database is still
# in Sydney until the Mumbai migration (docs/runbooks/mumbai-migration.md), so every query crosses regions until then.
# No latency has been measured; do not claim a number.
primary_region = "sin"

[build]

[env]
  HOST = "0.0.0.0"
  PORT = "8080"
  # Document bytes are encrypted in the application and stored in PostgreSQL (ADR 0013 D8). No volume, no file path.
  DOCUMENT_STORAGE_BACKEND = "database"
  # Two machines share state through the database, not through process memory.
  RATE_LIMIT_BACKEND = "database"
  MODEL_BUDGET_BACKEND = "database"
  # Scanner off: every upload stays quarantined. To enable it, use a 2 GB machine and set
  # DOCUMENT_SCAN_MODE = "clamd", CLAMD_HOST = "127.0.0.1".
  DOCUMENT_SCAN_MODE = "disabled"
  DATABASE_SSL_CA_PATH = "/app/docker/supabase-ca.crt"
  PUBLIC_HOSTS = "knowvia-api.fly.dev"
  TRUST_FLY_CLIENT_IP = "true"

# Secrets (never in this file): fly secrets set DATABASE_URL=... DOCUMENT_ENCRYPTION_KEY_BASE64=... DATA_ENCRYPTION_KEY_BASE64=...
# KNOWVIA_BOOTSTRAP_TOKEN=..., KNOWVIA_IDENTITY_TOKEN=... and IDENTITY_ISSUERS=... (website sign-in), and, when those features
# are enabled, GEMINI_API_KEY, SARVAM_API_KEY.
# DATABASE_URL is the Supabase transaction pooler (port 6543) for the API. Migrations (npm run db:init) must use the direct
# host or the session pooler (port 5432), never this URL. See docs/runbooks/fly-deploy.md.

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 2

  # Fly proxy load-balances and sheds load above the hard limit (free, built in). Limits are per machine.
  [http_service.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 80

  [[http_service.checks]]
    method = "GET"
    path = "/api/v1/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "60s"
    [http_service.checks.headers]
      Host = "knowvia-api.fly.dev"

# Two machines in sin. Run claims for the evidence service and the document scan worker are still per process (duplicate
# work, not corruption); the request limit, the model spend cap and document bytes are in PostgreSQL. clamd needs about
# 1 GB or more of RAM on its own, so it stays off on this size.
[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
