# CoverSaath API (Fly app knowvia-api). Nothing is deployed until `fly deploy` is run (owner approval required).
app = "knowvia-api"
# Owner decision (P1): Singapore. Fly has no Mumbai region, and Singapore is the nearest to India. The database is still
# in Sydney until the Mumbai migration (docs/runbooks/mumbai-migration.md), so every query crosses regions until then.
# No latency has been measured; do not claim a number.
primary_region = "sin"

[build]

[env]
  HOST = "0.0.0.0"
  PORT = "8080"
  # Document bytes are encrypted in the application and stored in PostgreSQL (ADR 0013 D8). No volume, no file path.
  DOCUMENT_STORAGE_BACKEND = "database"
  # The request limits and the model spend cap are shared through the database across both machines (database is also the
  # code default; per-process state that remains: see the [[vm]] note).
  RATE_LIMIT_BACKEND = "database"
  MODEL_BUDGET_BACKEND = "database"
  # Malware scanning on: clamd runs in the same container (docker/entrypoint.sh) and uploads are scanned before OCR.
  # DOCUMENT_SCAN_REQUIRED makes a missing scanner a startup error and a dead one a failing /api/v1/ready.
  # Needs the larger [[vm]] below: clamd holds the whole signature database in memory (about 1.2 GB or more).
  DOCUMENT_SCAN_MODE = "clamd"
  CLAMD_HOST = "127.0.0.1"
  DOCUMENT_SCAN_REQUIRED = "true"
  # Provider features stay off here and are turned on as staged Fly secrets after the keys exist (docs/runbooks/fly-deploy.md,
  # "Real workflow"), which keeps the paid step separate and reversible. Equivalent env lines, if ever committed here:
  #   SARVAM_OCR_ENABLED = "true"          needs SARVAM_API_KEY
  #   POLICY_STRUCTURING_ENABLED = "true"  needs GEMINI_API_KEY, LLM_MODEL and the two LLM_*_USD_PER_MILLION rates
  DATABASE_SSL_CA_PATH = "/app/docker/supabase-ca.crt"
  PUBLIC_HOSTS = "knowvia-api.fly.dev"
  TRUST_FLY_CLIENT_IP = "true"

# Secrets (never in this file): fly secrets set DATABASE_URL=... DOCUMENT_ENCRYPTION_KEY_BASE64=... DATA_ENCRYPTION_KEY_BASE64=...
# KNOWVIA_BOOTSTRAP_TOKEN=..., KNOWVIA_IDENTITY_TOKEN=... and IDENTITY_ISSUERS=... (website sign-in), and, when those features
# are enabled, GEMINI_API_KEY, SARVAM_API_KEY.
# DATABASE_URL is the Supabase transaction pooler (port 6543) for the API, but use port 6543 only after
# scripts/probe-pooler.mjs reports ok: true (not yet run); until then use the session pooler (port 5432). Migrations (npm run db:init) must use the direct
# host or the session pooler (port 5432), never this URL. See docs/runbooks/fly-deploy.md.

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  # min_machines_running does not create machines while auto-stop is off: scale to two explicitly and check `fly status`
  # after every deploy (docs/runbooks/fly-deploy.md).
  min_machines_running = 2

  # Fly proxy load-balances and sheds load above the hard limit (free, built in). Limits are per machine.
  [http_service.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 80

  [[http_service.checks]]
    method = "GET"
    path = "/api/v1/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "60s"
    [http_service.checks.headers]
      Host = "knowvia-api.fly.dev"

# Two machines in sin. Each runs its own clamd. The document scan worker is still per process (two machines can scan the same
# pending document; the persistence guards make that harmless). The request limit, the per-adult service limits, the model
# spend cap, the evidence claim and document bytes are in PostgreSQL (ADR 0014). Sizing is an estimate, not a measurement: clamd needs roughly 1.2 GB resident for the signature
# database, plus Node, the PDF sandbox children and headroom. Watch `fly machine status` memory and any OOM kill after the
# first deploy and adjust (docs/runbooks/fly-deploy.md, "Real workflow").
[[vm]]
  size = "shared-cpu-2x"
  memory = "3gb"
