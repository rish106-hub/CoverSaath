# clamd for document scanning (ADR 0005, docs/runbooks/clamav.md). Loopback only: the API reaches it at 127.0.0.1:3310.
Foreground yes
User clamav
DatabaseDirectory /var/lib/clamav
TCPSocket 3310
TCPAddr 127.0.0.1
LogTime yes
# No LogFile: in Foreground mode clamd logs to the console. /dev/stderr fails after clamd drops to the clamav user (symlinked fd).

# "Clean" must mean "fully scanned". Without AlertExceedsMax clamd answers `stream: OK` for input it only partly scanned
# (over a size or recursion limit), and the scanner treats OK as clean. StreamMaxLength must stay at or above the 15 MiB
# upload cap (MAX_DOCUMENT_BYTES): a larger stream is refused with an error, which the worker defers, never marks clean.
StreamMaxLength 16M
MaxScanSize 100M
MaxFileSize 16M
MaxRecursion 16
AlertExceedsMax yes
AlertEncrypted yes
AlertBrokenExecutables yes
ScanPDF yes

# Bounded work and bounded memory on a 2-3 GB machine. A signature reload blocks scans until it finishes instead of
# holding two engines in RAM at once; blocked scans time out as SCANNER_UNAVAILABLE and the worker retries (fail closed).
MaxThreads 4
ConcurrentDatabaseReload no
# clamd checks for new signatures on this interval (seconds) and reloads them; freshclam (docker/freshclam.conf) fetches them.
SelfCheck 600
