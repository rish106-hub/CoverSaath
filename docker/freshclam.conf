# Signature updater, run by docker/entrypoint.sh as the clamav user next to clamd. clamd reloads new signatures on its own
# SelfCheck interval, so no NotifyClamd is needed. The image also ships signatures baked in at build time.
DatabaseDirectory /var/lib/clamav
DatabaseOwner clamav
DatabaseMirror database.clamav.net
# Update checks per day. ClamAV's mirrors rate-limit above 24.
Checks 12
Foreground yes
LogTime yes
